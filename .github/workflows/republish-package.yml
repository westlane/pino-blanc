name: republish-package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to delete and republish (must match package.json)
        required: true
        default: "0.1.0"

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Confirm package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ inputs.version }}" ]; then
            echo "package.json version $pkg does not match input ${{ inputs.version }}"
            exit 1
          fi

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: "@westlane"

      - run: yarn install --immutable

      - name: Delete existing GitHub Packages version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${{ inputs.version }}"
          id="$(gh api user/packages/npm/pino-blanc/versions --jq ".[] | select(.name==\"$ver\") | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X DELETE "user/packages/npm/pino-blanc/versions/${id}"
            echo "Deleted @westlane/pino-blanc@${ver} (id ${id})"
          else
            echo "No published version ${ver}; continuing"
          fi

      - run: yarn run check
      - run: yarn build

      - name: Publish to GitHub Packages
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
