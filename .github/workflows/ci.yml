name: ci

on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [dev, main, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --immutable
      # `yarn run check` — avoid Yarn classic's built-in `yarn check`.
      - run: yarn run check
      # Branch-relative README badges (docs/badges/*.svg) must match this run.
      - name: Verify README badges are current
        run: node scripts/verify-readme-badges.mjs
