name: ci

on:
  pull_request:
    branches: [main, prod, dev]
  push:
    branches: [dev, main, prod]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      # Branch-relative README badges (docs/badges/*.svg) must match this run.
      - name: Verify README badges are current
        run: git diff --exit-code -- docs/badges/
