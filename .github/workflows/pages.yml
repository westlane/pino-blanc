name: pages

on:
  push:
    branches: [main]
    paths:
      - "examples/browser-frameworks/**"
      - "src/**"
      - "themes/**"
      - "config/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn demo:browser:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
