# yarn build → src/layout/layout.data.ts
#
# default     Active text preset when createLogger omits layout.
# text.*      Plain lines — layout: "<id>"
# event.*     log.event() — eventLayout: "<id>"
#
# Field tokens: %name% or %name:width% or %name:width:right% (module aligns right when last).

default: module-right

text:
  module-right: "%level:6% %emoji:4%  %message:34% %module:18%"
  module-first: "%level:6% %module:18% %message%"

event:
  identity-meta: |
    %identity:28% %emoji:4%  %event:28%
    %identity:28% %emoji:4%  %meta%

columns:
  box:
    width: 80
    minInner: 20
    pad: 4
    ellipsis: 3
  hashShift: 5
