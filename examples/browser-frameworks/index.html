      (() => {
        try {
          const stored = localStorage.getItem("pino-blanc-demo-scheme");

            stored === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.scheme = "dark";
        }
      })();

        --glass-fill: color-mix(in srgb, var(--header-bg) 52%, transparent);

        --panel-border: color-mix(in srgb, #ffffff 78%, transparent);
        --panel-radius: 0.75rem;

        /* Top-lit liquid sheen layered over frosted fills. */

        --liquid-ink: 5%;
        --liquid-layer-a: 0.55;
        --liquid-layer-b: 0.4;
        background: var(--page-bg);
        color: var(--page-fg);
      }
      /* Approximate dracula-dark chrome (default Vanilla tab) to avoid light-to-dark FOUC. */
      html[data-scheme="dark"] {
        --page-bg: #141414;
        --page-fg: #ebdbb2;
        --page-fg-muted: #a89984;
        --tablist-bg: #141414;
        --tab-idle-fg: #ebdbb2;
        --tab-hover-bg: #3c3c3c;
        --tab-hover-fg: #fbf1c7;
        --focus-ring: #bd93f9;
        --header-bg: #141414;
        /* FOUC: Vanilla dark identity (dracula) until JS paints. */

        --card-shadow:

        --glass-fill: color-mix(in srgb, var(--header-bg) 38%, transparent);
        /* Dark: thinner theme frost so blur reads more liquid. */
        --glass-panel: color-mix(in srgb, var(--theme-surface) 42%, transparent);
        --panel-border: color-mix(in srgb, #ffffff 16%, transparent);
        --panel-shadow:
          var(--glass-rim),
          inset 0 -1px 2px color-mix(in srgb, #000000 10%, transparent),
          0 1px 2px color-mix(in srgb, #000000 25%, transparent),
          0 10px 28px color-mix(in srgb, #000000 38%, transparent);
        --glass-edge: color-mix(in srgb, #ffffff 10%, transparent);
        --glass-edge-soft: color-mix(in srgb, #ffffff 4%, transparent);
        --glass-rim: inset 0 1px 0 color-mix(in srgb, #ffffff 14%, transparent);
        --glass-blur: blur(36px) saturate(1.65);
        --glass-sheen: linear-gradient(

        --liquid-ink: 18%;

        --liquid-layer-b: 0.8;
        color-scheme: dark;

      /* Page chrome colors are refined by the active tab theme (demo-tab-chrome.ts). */
      *,

      }

      /* Liquid glass atmosphere behind the demo card. */
      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -25%;
        z-index: -1;
        pointer-events: none;
        border-radius: 50%;
      }
      body::before {
        background:
          radial-gradient(
            ellipse 42% 36% at 18% 28%,
            color-mix(in srgb, var(--focus-ring) var(--liquid-accent-strong), transparent),
            transparent 70%
          ),
          radial-gradient(
            ellipse 38% 44% at 82% 18%,
            color-mix(in srgb, var(--page-fg) var(--liquid-ink), transparent),
            transparent 68%
          ),
          radial-gradient(
            ellipse 48% 40% at 58% 78%,
            color-mix(in srgb, var(--focus-ring) var(--liquid-accent-soft), transparent),
            transparent 72%
          );
        filter: blur(56px) saturate(1.25);
        opacity: var(--liquid-layer-a);
        animation: liquid-drift 22s ease-in-out infinite alternate;
      }
      body::after {
        background:
          radial-gradient(
            ellipse 36% 32% at 72% 62%,
            color-mix(in srgb, var(--focus-ring) var(--liquid-accent-soft), transparent),
            transparent 70%
          ),
          radial-gradient(
            ellipse 30% 28% at 28% 72%,
            color-mix(in srgb, #ffffff 22%, transparent),
            transparent 65%
          );
        filter: blur(64px) saturate(1.2);
        opacity: var(--liquid-layer-b);
        animation: liquid-drift-alt 28s ease-in-out infinite alternate;
      }
      @keyframes liquid-drift {
        from {
          transform: translate3d(-2%, -1%, 0) scale(1);
        }
        to {
          transform: translate3d(3%, 2%, 0) scale(1.06);
        }
      }
      @keyframes liquid-drift-alt {
        from {
          transform: translate3d(2%, 1%, 0) scale(1.04);
        }
        to {
          transform: translate3d(-3%, -2%, 0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after {
          animation: none;
        }

      .demo-tablist {

    <div class="demo-shell">

          type="button"
          role="tab"

          style="--tab-bg: #282a36; --tab-fg: #f8f8f2"

          Vanilla
        </button>
        <button
          type="button"
          role="tab"

          tabindex="-1"
          style="--tab-bg: #002b36; --tab-fg: #eee8d5"
        >
          React
        </button>
        <button
          type="button"
          role="tab"
          data-tab="vue"
          aria-selected="false"
          tabindex="-1"
          style="--tab-bg: #1e1e2e; --tab-fg: #cdd6f4"
        >
          Vue
        </button>
        <button
          type="button"
          role="tab"
          data-tab="svelte"
          aria-selected="false"
          tabindex="-1"
          style="--tab-bg: #1a1b26; --tab-fg: #c0caf5"
        >
          Svelte
        </button>
      </div>
      <script>
        (() => {
          const aliases = {
            vanilla: "vanilla",
            react: "react",
            vue: "vue",
            vu: "vue",
            svelte: "svelte",
          };
          const raw = location.hash.replace(/^#/, "").trim().toLowerCase();
          const id = aliases[raw] || "vanilla";
          for (const tab of document.querySelectorAll('[role="tab"][data-tab]')) {
            const on = tab.getAttribute("data-tab") === id;
            tab.setAttribute("aria-selected", on ? "true" : "false");
            tab.tabIndex = on ? 0 : -1;
          }
          for (const panel of document.querySelectorAll('[role="tabpanel"][data-panel]')) {
            panel.hidden = panel.getAttribute("data-panel") !== id;
          }
        })();
      </script>
      <div class="demo-frame">
        <section role="tabpanel" data-panel="vanilla" id="panel-vanilla">
          <div id="log-preview-vanilla" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="react" id="panel-react" hidden>
          <div id="log-preview-react" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="vue" id="panel-vue" hidden>
          <div id="log-preview-vue" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="svelte" id="panel-svelte" hidden>
          <div id="log-preview-svelte" class="log-preview" aria-live="polite"></div>
        </section>
      </div>
        </div>
      </main>
