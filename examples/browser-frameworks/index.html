<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Adapters for Logging — pino-blanc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-optical-sizing: auto;
        color-scheme: light;
        background: #ffffff;
        color: #1a1a2e;
        --demo-radius: 12px;
      }
      *,
      *::before,
      *::after {
        border-radius: 0;
      }
      html {
        height: 100%;
        overflow: hidden;
      }
      body {
        box-sizing: border-box;
        height: 100%;
        margin: 0;
        padding: 2rem;
        max-width: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
      }
      body > h1,
      body > p {
        flex-shrink: 0;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        opacity: 0.85;
        line-height: 1.5;
      }
      .demo-tabs {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        overflow: hidden;
      }
      .demo-tablist {
        display: flex;
        gap: 0.35rem;
        margin: 0;
        padding: 0.35rem;
        list-style: none;
        border: none;
        background: #e8eaef;
        border-radius: var(--demo-radius);
      }
      .demo-tablist [role="tab"] {
        flex: 1;
        cursor: pointer;
        padding: 0.5rem 1rem;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        text-align: center;
        border-radius: calc(var(--demo-radius) - 4px);
        transition: background 0.15s ease, color 0.15s ease;
      }
      .demo-tablist [role="tab"][aria-selected="true"] {
        background: #ffffff;
        font-weight: 600;
        color: #1a1a2e;
      }
      .demo-tablist [role="tab"]:hover:not([aria-selected="true"]) {
        background: rgba(255, 255, 255, 0.55);
      }
      .demo-frame {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border: none;
        background: transparent;
        padding: 0;
        box-sizing: border-box;
        border-radius: var(--demo-radius);
        overflow: hidden;
      }
      [role="tabpanel"] {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      [role="tabpanel"][hidden] {
        display: none;
      }
      .log-preview {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        border-radius: var(--demo-radius);
      }
      .pb-log-line {
        max-width: 100%;
        overflow: hidden;
      }
      .pb-log-line + .pb-log-line {
        margin-top: 0.05rem;
      }
      code {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <h1>Browser Adapters for Logging</h1>
    <p>
      Open your browser console with developer tools or preview below.
    </p>
    <div class="demo-tabs">
      <div class="demo-tablist" role="tablist" aria-label="Framework">
        <button
          type="button"
          role="tab"
          data-tab="vanilla"
          data-theme="solarized-dark"
          title="Solarized Dark"
          aria-selected="true"
        >
          Vanilla
        </button>
        <button
          type="button"
          role="tab"
          data-tab="react"
          data-theme="dracula"
          title="Dracula"
          aria-selected="false"
          tabindex="-1"
        >
          React
        </button>
        <button
          type="button"
          role="tab"
          data-tab="vue"
          data-theme="nord"
          title="Nord"
          aria-selected="false"
          tabindex="-1"
        >
          Vue
        </button>
        <button
          type="button"
          role="tab"
          data-tab="svelte"
          data-theme="gruvbox-dark"
          title="Gruvbox Dark"
          aria-selected="false"
          tabindex="-1"
        >
          Svelte
        </button>
      </div>
      <div class="demo-frame">
        <section role="tabpanel" data-panel="vanilla" id="panel-vanilla">
          <div id="log-preview-vanilla" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="react" id="panel-react" hidden>
          <div id="log-preview-react" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="vue" id="panel-vue" hidden>
          <div id="log-preview-vue" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="svelte" id="panel-svelte" hidden>
          <div id="log-preview-svelte" class="log-preview" aria-live="polite"></div>
        </section>
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
