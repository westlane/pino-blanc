<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Adapters for Logging — pino-blanc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-optical-sizing: auto;
        color-scheme: light dark;
        --demo-radius: 0;
        --demo-card-radius: 0.75rem;
        --page-bg: #ffffff;
        --page-fg: #1a1a2e;
        --page-fg-muted: #4b5563;
        --tablist-bg: #eef0f4;
        --tab-idle-fg: #5a6170;
        --tab-hover-bg: rgba(255, 255, 255, 0.55);
        --tab-hover-fg: #1a1a2e;
        --focus-ring: #94a3b8;
        --sidebar-width: 10.75rem;
        --header-bg: #f4f5f8;
        --card-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 8px 24px rgba(15, 23, 42, 0.08),
          0 24px 56px rgba(15, 23, 42, 0.12);
        background: var(--page-bg);
        color: var(--page-fg);
      }
      /* Approximate solarized-dark chrome so the shell does not flash light→dark. */
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #00151a;
          --page-fg: #eee8d5;
          --page-fg-muted: #93a1a1;
          --tablist-bg: #00232c;
          --tab-idle-fg: #eee8d5;
          --tab-hover-bg: #1a404a;
          --tab-hover-fg: #fdf6e3;
          --focus-ring: #268bd2;
          --header-bg: #1a404a;
          --card-shadow:
            0 1px 2px rgba(0, 0, 0, 0.2),
            0 10px 28px rgba(0, 0, 0, 0.35),
            0 28px 64px rgba(0, 0, 0, 0.45);
          color-scheme: dark;
        }
      }
      /* Page chrome colors are refined by the active tab theme (demo-tab-chrome.ts). */
      *,
      *::before,
      *::after {
        border-radius: 0;
      }
      html {
        height: 100%;
        overflow: hidden;
        background: var(--page-bg);
      }
      body {
        box-sizing: border-box;
        height: 100%;
        margin: 0;
        padding: 2rem 2.5rem 2.5rem;
        max-width: none;
        display: flex;
        flex-direction: column;
        gap: 0;
        min-height: 0;
        overflow: hidden;
        background: var(--page-bg);
        color: var(--page-fg);
      }
      .demo-shell {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--header-bg);
        border-radius: var(--demo-card-radius);
        box-shadow: var(--card-shadow);
      }
      .demo-header {
        flex-shrink: 0;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 1.25rem 1.5rem;
        background: var(--header-bg);
      }
      .demo-header h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .demo-header p {
        margin: 0.35rem 0 0;
        color: var(--page-fg-muted);
        line-height: 1.45;
        font-size: 0.8125rem;
      }
      .demo-main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        container-type: inline-size;
        container-name: demo-main;
      }
      .demo-tabs {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        gap: 0;
        overflow: hidden;
      }
      .demo-tablist {
        flex: 0 0 var(--sidebar-width);
        width: var(--sidebar-width);
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        border: none;
        background: var(--tablist-bg);
        border-radius: var(--demo-radius);
        box-sizing: border-box;
        /* Hold paint until theme + hash selection apply (main.ts → .demo-ready). */
        opacity: 0;
      }
      html.demo-ready .demo-tablist {
        opacity: 1;
      }
      .demo-tablist [role="tab"] {
        flex: 0 0 auto;
        width: 100%;
        cursor: pointer;
        padding: 0.6rem 0.85rem;
        border: none;
        background: transparent;
        color: var(--tab-idle-fg);
        font: inherit;
        font-weight: 500;
        text-align: left;
        border-radius: var(--demo-radius);
        outline: none;
        box-shadow: none;
      }
      html.demo-ready .demo-tablist [role="tab"] {
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .demo-tablist [role="tab"]:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }
      .demo-tablist [role="tab"][aria-selected="true"] {
        background: var(--tab-bg, #073642);
        color: var(--tab-fg, #eee8d5);
        font-weight: 600;
      }
      .demo-tablist [role="tab"]:hover:not([aria-selected="true"]) {
        background: var(--tab-hover-bg);
        color: var(--tab-hover-fg);
      }
      /* Narrow main: horizontal framework tabs under the terminal */
      @container demo-main (max-width: 40rem) {
        .demo-tabs {
          flex-direction: column-reverse;
          gap: 0;
        }
        .demo-tablist {
          flex: 0 0 auto;
          width: 100%;
          height: auto;
          min-height: 0;
          align-self: stretch;
          flex-direction: row;
          align-items: stretch;
          gap: 0;
          padding: 0;
        }
        .demo-tablist [role="tab"] {
          flex: 1 1 0;
          width: auto;
          min-width: 0;
          padding: 0.55rem 0.4rem;
          text-align: center;
          font-size: 0.875rem;
        }
      }
      .demo-frame {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border: none;
        background: transparent;
        padding: 0;
        box-sizing: border-box;
        border-radius: var(--demo-radius);
        overflow: hidden;
      }
      [role="tabpanel"] {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      [role="tabpanel"][hidden] {
        display: none;
      }
      .log-preview {
        flex: 1;
        min-height: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        border-radius: var(--demo-radius);
      }
      .pb-log-line {
        max-width: 100%;
        overflow: hidden;
        padding-bottom: 0.15rem;
      }
      .pb-log-line + .pb-log-line {
        margin-top: 0.4rem;
      }
      code {
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <div class="demo-shell">
      <header class="demo-header">
        <h1>Browser Adapters for Logging</h1>
        <p>
          Open your browser console with developer tools, or use the preview console on the right.
        </p>
      </header>
      <main class="demo-main">
        <div class="demo-tabs">
      <div
        class="demo-tablist"
        role="tablist"
        aria-label="Framework"
        aria-orientation="vertical"
      >
        <button
          type="button"
          role="tab"
          data-tab="vanilla"
          aria-selected="true"
          style="--tab-bg: #002b36; --tab-fg: #eee8d5"
        >
          Vanilla
        </button>
        <button
          type="button"
          role="tab"
          data-tab="react"
          aria-selected="false"
          tabindex="-1"
          style="--tab-bg: #282a36; --tab-fg: #f8f8f2"
        >
          React
        </button>
        <button
          type="button"
          role="tab"
          data-tab="vue"
          aria-selected="false"
          tabindex="-1"
          style="--tab-bg: #2e3440; --tab-fg: #eceff4"
        >
          Vue
        </button>
        <button
          type="button"
          role="tab"
          data-tab="svelte"
          aria-selected="false"
          tabindex="-1"
          style="--tab-bg: #282828; --tab-fg: #ebdbb2"
        >
          Svelte
        </button>
      </div>
      <script>
        (() => {
          const aliases = {
            vanilla: "vanilla",
            react: "react",
            vue: "vue",
            vu: "vue",
            svelte: "svelte",
          };
          const raw = location.hash.replace(/^#/, "").trim().toLowerCase();
          const id = aliases[raw] || "vanilla";
          for (const tab of document.querySelectorAll('[role="tab"][data-tab]')) {
            const on = tab.getAttribute("data-tab") === id;
            tab.setAttribute("aria-selected", on ? "true" : "false");
            tab.tabIndex = on ? 0 : -1;
          }
          for (const panel of document.querySelectorAll('[role="tabpanel"][data-panel]')) {
            panel.hidden = panel.getAttribute("data-panel") !== id;
          }
        })();
      </script>
      <div class="demo-frame">
        <section role="tabpanel" data-panel="vanilla" id="panel-vanilla">
          <div id="log-preview-vanilla" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="react" id="panel-react" hidden>
          <div id="log-preview-react" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="vue" id="panel-vue" hidden>
          <div id="log-preview-vue" class="log-preview" aria-live="polite"></div>
        </section>
        <section role="tabpanel" data-panel="svelte" id="panel-svelte" hidden>
          <div id="log-preview-svelte" class="log-preview" aria-live="polite"></div>
        </section>
      </div>
        </div>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
